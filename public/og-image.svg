<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D0F"/>
      <stop offset="100%" style="stop-color:#141416"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="55%" r="45%">
      <stop offset="0%" style="stop-color:rgba(79,142,247,0.18)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="25%" r="40%">
      <stop offset="0%" style="stop-color:rgba(52,211,153,0.1)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Glow overlays -->
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Accent line -->
  <rect x="80" y="220" width="56" height="3" rx="2" fill="#4F8EF7"/>
  <!-- Label -->
  <text x="80" y="197" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700" fill="#4F8EF7" letter-spacing="2">HUMAN PERFORMANCE RESEARCH</text>
  <!-- Main headline -->
  <text x="80" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="72" font-weight="800" fill="#F8F8F8" letter-spacing="-2.5">The Human</text>
  <text x="80" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="72" font-weight="800" fill="#F8F8F8" letter-spacing="-2.5">Decision</text>
  <!-- Tagline -->
  <text x="80" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="400" fill="rgba(248,248,248,0.5)" letter-spacing="-0.3">Attention shapes everything.</text>
  <!-- URL -->
  <text x="80" y="565" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="500" fill="rgba(248,248,248,0.25)">thehumandecision.in</text>
  <!-- Right side visual element -->
  <circle cx="980" cy="315" r="140" fill="none" stroke="rgba(79,142,247,0.12)" stroke-width="1" stroke-dasharray="6 6"/>
  <circle cx="980" cy="315" r="90" fill="none" stroke="rgba(79,142,247,0.08)" stroke-width="1"/>
  <circle cx="980" cy="315" r="40" fill="rgba(79,142,247,0.1)" stroke="rgba(79,142,247,0.3)" stroke-width="1.5"/>
  <!-- Node dots on outer circle -->
  <circle cx="980" cy="175" r="6" fill="#4F8EF7" opacity="0.7"/>
  <circle cx="1101" cy="245" r="5" fill="#34D399" opacity="0.6"/>
  <circle cx="1101" cy="385" r="5" fill="#4F8EF7" opacity="0.5"/>
  <circle cx="980" cy="455" r="6" fill="#FBBF24" opacity="0.6"/>
  <circle cx="859" cy="385" r="5" fill="#F87171" opacity="0.5"/>
  <circle cx="859" cy="245" r="5" fill="#4F8EF7" opacity="0.6"/>
  <!-- Connecting lines -->
  <line x1="980" y1="175" x2="1101" y2="245" stroke="rgba(79,142,247,0.2)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="1101" y1="245" x2="1101" y2="385" stroke="rgba(52,211,153,0.2)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="1101" y1="385" x2="980" y2="455" stroke="rgba(79,142,247,0.2)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="980" y1="455" x2="859" y2="385" stroke="rgba(251,191,36,0.2)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="859" y1="385" x2="859" y2="245" stroke="rgba(248,113,113,0.2)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="859" y1="245" x2="980" y2="175" stroke="rgba(79,142,247,0.2)" stroke-width="1" stroke-dasharray="4 4"/>
</svg>
